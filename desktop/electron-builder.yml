# 繁梦空间桌面客户端打包配置（electron-builder）
# Windows：NSIS 安装包（x64）  macOS：DMG + ZIP（Apple 芯片 arm64 / Intel x64）
# 用法见 desktop/README.md
appId: top.fmkj.desktop
productName: 繁梦空间
copyright: Copyright © 2026 繁梦空间智能信息技术
artifactName: FanmengSpace-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: resources

files:
  - package.json
  - app-config.json
  - src/**/*

asar: true
# 没有原生模块，不需要按平台重新编译依赖
npmRebuild: false

protocols:
  - name: 繁梦空间
    schemes:
      - fanmeng

# 自动更新清单（latest.yml / latest-mac.yml）指向自己的服务器，
# 客户端运行时会按「服务器设置」里的地址拼出 /downloads/desktop。
publish:
  - provider: generic
    url: https://fmkj.top/downloads/desktop

# 没有 Apple 开发者证书时做 ad-hoc 签名，避免 Apple 芯片提示「已损坏」
afterSign: scripts/after-sign.cjs

mac:
  category: public.app-category.productivity
  icon: resources/icon-mac.png
  minimumSystemVersion: "12.0"
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  artifactName: FanmengSpace-${version}-mac-${arch}.${ext}
  title: 繁梦空间 ${version}
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  icon: resources/icon-win.png
  executableName: FanmengSpace
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: FanmengSpace-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 繁梦空间
  uninstallDisplayName: 繁梦空间
  installerLanguages:
    - zh_CN
  language: "2052"
  deleteAppDataOnUninstall: false
  differentialPackage: true
