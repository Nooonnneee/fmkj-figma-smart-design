<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>服务器设置 · Eevee</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="settings">
    <main class="form-panel">
      <header class="form-header">
        <img class="logo small" src="icon.svg" alt="" width="44" height="44" />
        <div>
          <h1>服务器设置</h1>
          <p>客户端默认连接繁梦空间官方服务器。团队使用私有部署时，填写自己的访问地址。</p>
        </div>
      </header>
      <form id="form" novalidate>
        <label for="server">服务器地址</label>
        <input id="server" name="server" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://fmkj.top" required />
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div class="form-actions">
          <button id="reset" type="button" class="link">恢复默认</button>
          <span class="spacer"></span>
          <button id="test" type="button">测试连接</button>
          <button id="save" type="submit" class="primary">保存并连接</button>
        </div>
      </form>

      <section id="ha" class="section" aria-labelledby="ha-title">
        <div class="section-header">
          <div>
            <h2 id="ha-title">智能家居</h2>
            <p class="section-lead">连接局域网里的 Home Assistant。令牌只保存在本机，由系统安全存储加密（Linux 需密钥环），不会上传服务器。测试连接会先保存当前输入。</p>
          </div>
          <button id="ha-discover" type="button">发现设备</button>
        </div>
        <p id="ha-discover-status" class="status" role="status" aria-live="polite"></p>
        <ul id="ha-devices" class="device-list" hidden></ul>

        <label for="ha-url">Home Assistant 地址</label>
        <input id="ha-url" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="http://homeassistant.local:8123" />

        <label for="ha-token">长期访问令牌</label>
        <input id="ha-token" type="password" autocomplete="off" spellcheck="false" placeholder="在 Home Assistant「个人资料」页创建" />

        <p id="ha-status" class="status" role="status" aria-live="polite"></p>
        <div class="form-actions">
          <button id="ha-clear" type="button" class="link">清除</button>
          <span class="spacer"></span>
          <button id="ha-test" type="button">测试连接</button>
          <button id="ha-save" type="button" class="primary">保存</button>
        </div>
      </section>

      <footer id="version" class="meta"></footer>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
