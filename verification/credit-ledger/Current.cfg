\* Today's code, after the row-lock fix: beforeChange locks the user row
\* (SELECT ... FOR UPDATE) in the same transaction, so two concurrent creates
\* are serialized and the second re-reads the committed balance.
\* Atomic = TRUE is the fixed code; the bug it replaced is preserved in git history.
CONSTANTS
  InitialBalance = 5
  Ops = {1, 2}
  Atomic = TRUE
  Guard = TRUE

INIT Init
NEXT Next
INVARIANT TypeOK
INVARIANT BalanceMatchesLedger
INVARIANT NoOverdraft
